<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title> 
</head>
<body>
    <div class="container"> 
        <div class="parent_section">
            
            <div class="header">
                <input class="input" type="text" placeholder="Search Here">
                <button class="button"><img class="serch" src="/weather-app-img/images/search.png" alt="Search Icon"></button>
            </div>
            
            <div class="section_one">
                <img class="rain" src="/weather-app-img/images/rain.png" alt="Weather Icon">
                <h2 class="h2">22°C</h2>
                <h3 class="h3">New York</h3>
            </div>

            <div class="section_two">
                
                <div class="one">
                    <p><img class="humidity" src="/weather-app-img/images/humidity.png" alt="Humidity Icon"></p>
                    <div>
                        <p class="p1">50%</p> 
                        <p class="p2 muted">Humidity</p>
                    </div>
                </div>
                
                <div class="two">
                    <p class="p3"><img class="wind" src="/weather-app-img/images/wind.png" alt="Wind Icon"></p>
                    <div>
                        <p class="p4">15 Km/h</p> 
                        <p class="p5 muted">Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
